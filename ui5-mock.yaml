specVersion: "4.0"
metadata:
  name: zgrrequest
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: http://yas4erpdevhttp:44380
            client: "100"
            destination: YAGEOS4PCE_DEV
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
    - name: sap-fe-mockserver
      beforeMiddleware: fiori-tools-proxy
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata4/sap/zui_gr_request/srvd/sap/zsd_gr_request/0001
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mockdata
            generateMockData: true
            annotations: []
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: zgrrequest
        ui5Theme: sap_horizon
